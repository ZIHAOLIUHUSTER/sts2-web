name: Android APK

on:
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build APK
        run: |
          npm install --global pnpm@11.22.0
          pnpm install --frozen-lockfile
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          bash android/build.sh
          cd android/build
          sha256sum sts2-web-debug.apk > sts2-web-debug.apk.sha256
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" android/build/sts2-web-debug.apk android/build/sts2-web-debug.apk.sha256 \
            --verify-tag --prerelease --title "Android APK · $GITHUB_REF_NAME" \
            --notes 'Android 首个测试 APK，内置游戏资源与 Wiki。Android 8.0+，请更新 Android System WebView。调试签名，尚未真机验证。请检查画面、音效、触控和保存后重新打开继续游戏。应用存档独立于浏览器；卸载或清除数据会删除存档。构建说明见 android/README.md，首版尚未实现 Blob 备份下载。'
