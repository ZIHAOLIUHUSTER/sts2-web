name: Android APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Android release tag
        required: true
        default: android-v0.7.0
  push:
    tags: ['android-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Build APK
        run: |
          npm install --global pnpm@11.22.0
          pnpm install --frozen-lockfile
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          bash android/build.sh
          cd android/build
          sha256sum sts2-web-debug.apk > sts2-web-debug.apk.sha256
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Android APK · $RELEASE_TAG" \
              --notes-file android/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" android/build/sts2-web-debug.apk android/build/sts2-web-debug.apk.sha256
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
